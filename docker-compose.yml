services:
  web:
    build: .
    image: notes-web:1.0
    ports:
      - "${WEB_PORT:-80}:8000"   # host port 80 -> container port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections
    uts: host   # page shows the EC2 hostname, proving which instance served it
    restart: unless-stopped

  db:
    image: postgres:16   # pinned major version for reproducible builds
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data outlives the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No ports: section. Postgres is reachable only by web, on the Compose network.

volumes:
  pgdata:
